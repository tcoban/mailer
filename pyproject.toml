[project]
name = "kofmailer"
version = "0.1.0"
description = "Spec-first mail orchestration service"
authors = [
    {name = "KOF Team", email = "dev@example.com"},
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.2.1",
    "cryptography>=42.0.5",
    "redis>=5.0.3",
    "httpx>=0.27.0",
    "alembic>=1.13.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.1",
    "tenacity>=8.2.3",
    "structlog>=24.1.0",
    "orjson>=3.10.0",
    "prometheus-client>=0.20.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
    "types-redis>=4.6.0.20240311",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
